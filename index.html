<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Apps — Andres Aranguibel</title>
<meta name="description" content="An index of microsites published at sites.aranguibel.com.">
<meta property="og:type" content="website">
<meta property="og:title" content="Apps — Andres Aranguibel">
<meta property="og:description" content="Every microsite published at sites.aranguibel.com, in one place.">
<meta property="og:url" content="https://sites.aranguibel.com/">
<meta property="og:image" content="https://sites.aranguibel.com/assets/headshot.jpg">
<meta name="twitter:card" content="summary">
<meta name="twitter:image" content="https://sites.aranguibel.com/assets/headshot.jpg">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Apps">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fed600'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-style='italic' font-size='38' fill='%23131c2b' text-anchor='middle'%3Ea%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Wire+One&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --edge: #e7e7e7;
    --edge-strong: #c9c9c9;
    --ink: #272727;
    --headline: #131313;
    --muted: #767676;
    --faint: #a8a8a8;
    --brand: #fed600;
    --on-brand: #131c2b;
    --shadow: 0 1px 2px rgba(39, 39, 39, 0.05), 0 12px 32px -12px rgba(39, 39, 39, 0.18);
    --shadow-lift: 0 2px 4px rgba(39, 39, 39, 0.06), 0 20px 44px -14px rgba(39, 39, 39, 0.28);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101010;
      --surface: #171717;
      --edge: #2b2b2b;
      --edge-strong: #4a4a4a;
      --ink: #e8e8e8;
      --headline: #f5f5f5;
      --muted: #a3a3a3;
      --faint: #6f6f6f;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.45), 0 12px 32px -12px rgba(0, 0, 0, 0.6);
      --shadow-lift: 0 2px 4px rgba(0, 0, 0, 0.5), 0 20px 44px -14px rgba(0, 0, 0, 0.72);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "proxima-nova", "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--ink);
    min-height: 100vh; min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 72rem; margin: 0 auto; padding: 0 1.5rem; }

  /* Header bar, after aranguibel.com — sticky: stays pinned while the page scrolls */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: var(--bg);
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: max(1.1rem, env(safe-area-inset-top)) 0 1.1rem;
    border-bottom: 1px solid var(--edge);
  }
  .brand-lockup { display: flex; align-items: center; gap: 0.8rem; text-decoration: none; color: inherit; min-width: 0; }
  .brand-lockup img {
    width: 2.6rem; height: 2.6rem; border-radius: 50%; flex: 0 0 auto;
    object-fit: cover; aspect-ratio: 1 / 1; display: block;
  }
  .brand-lockup .site-title {
    font-family: "Wire One", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 1.55rem; font-weight: 700; letter-spacing: 0.045em; line-height: 1;
    color: var(--headline); white-space: nowrap;
  }
  .topbar nav a {
    font-size: 0.72rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--muted); text-decoration: none; white-space: nowrap;
  }
  .topbar nav a:hover { color: var(--headline); }

  /* Hero */
  .hero {
    display: grid; gap: 2rem; align-items: center;
    padding: 3rem 0 2.6rem;
  }
  @media (min-width: 760px) {
    .hero { grid-template-columns: 1fr 19rem; padding: 4rem 0 3.2rem; }
  }
  .hero-photo { display: none; }
  @media (min-width: 760px) {
    .hero-photo {
      display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover;
      border-radius: 4px;
    }
  }
  .kicker {
    display: flex; align-items: center; gap: 0.65rem;
    font-size: 0.7rem; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 1.2rem;
  }
  .kicker::before { content: ""; width: 2rem; height: 3px; background: var(--brand); flex: 0 0 auto; }
  h1 {
    font-family: "Wire One", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: clamp(4.2rem, 13vw, 7.5rem); font-weight: 400; line-height: 0.95;
    letter-spacing: 0.01em; color: var(--headline); text-transform: uppercase;
  }
  /* Index */
  .index-head {
    display: flex; align-items: baseline; justify-content: space-between;
    border-top: 1px solid var(--edge); padding-top: 1.4rem; margin-bottom: 1.2rem;
  }
  .index-head h2 {
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: var(--headline);
  }
  .index-head span { font-size: 0.8rem; color: var(--faint); }
  .grid {
    display: grid; gap: 1.1rem;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 20rem), 1fr));
    margin-bottom: 3.5rem;
  }
  .card {
    display: flex; flex-direction: column; gap: 0.7rem;
    padding: 1.5rem 1.5rem 1.35rem; min-height: 10rem;
    background: var(--surface); text-decoration: none; color: inherit;
    border: 1px solid var(--edge); border-radius: 20px;
    box-shadow: var(--shadow);
    transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .card:hover, .card:focus-visible { transform: translateY(-3px); box-shadow: var(--shadow-lift); outline: none; }
  .card:active { transform: translateY(-1px) scale(0.995); box-shadow: var(--shadow); }
  .mark {
    width: 2.6rem; height: 2.6rem; border-radius: 4px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 1.35rem;
    color: var(--brand); background: var(--headline);
  }
  @media (prefers-color-scheme: dark) { .mark { background: var(--brand); color: var(--on-brand); } }
  .icon {
    width: 3.6rem; height: 3.6rem; border-radius: 26%; flex: 0 0 auto;
    object-fit: cover; aspect-ratio: 1 / 1; display: block;
    border: 1px solid var(--edge);
    box-shadow: 0 2px 8px rgba(39, 39, 39, 0.12);
  }
  .card h3 { font-size: 1.08rem; font-weight: 600; letter-spacing: -0.005em; color: var(--headline); }
  .card p { font-size: 0.92rem; line-height: 1.55; color: var(--muted); flex: 1 1 auto; }

  footer {
    border-top: 1px solid var(--edge);
    padding: 1.4rem 0 max(2.2rem, env(safe-area-inset-bottom));
    display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; justify-content: space-between;
    font-size: 0.8rem; color: var(--faint); line-height: 1.6;
  }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--headline); }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a class="brand-lockup" href="https://www.aranguibel.com" aria-label="Andres Aranguibel — portfolio">
      <img src="assets/headshot.jpg" alt="Portrait of Andres Aranguibel" width="180" height="180">
      <span class="site-title">ANDRES ARANGUIBEL</span>
    </a>
    <nav><a href="https://www.aranguibel.com">Portfolio &rarr;</a></nav>
  </div>

  <section class="hero">
    <div>
      <div class="kicker">sites.aranguibel.com</div>
      <h1>Apps</h1>
    </div>
    <img class="hero-photo" src="assets/headshot.jpg" alt="Portrait of Andres Aranguibel" width="720" height="720">
  </section>

  <div class="index-head">
    <h2>Index</h2>
    <span id="count"></span>
  </div>
  <nav class="grid" id="sites" aria-label="Microsites"></nav>

  <footer>
    <span>New sites appear here as they're published.</span>
    <a href="https://www.aranguibel.com">aranguibel.com</a>
  </footer>
</div>

<script>
  // The index of published microsites. One entry per folder in the repo;
  // this list is updated in the same commit that publishes a new site.
  // Every site gets its own contextual icon: prefer an icon the site itself
  // ships (e.g. its app icon); otherwise a custom one lives in assets/icons/.
  const SITES = [
    {
      path: "max-pocket-agenda/",
      title: "MAX Pocket Agenda",
      description: "Adobe MAX 2026 companion — schedule, people, and places, in your pocket.",
      icon: "max-pocket-agenda/icons/icon-512.png",
      monogram: "M"
    },
    {
      path: "cycles/",
      title: "Cycles",
      description: "Recurring chores and to-dos — each on its own cadence, resetting when done.",
      icon: "cycles/icons/icon-512.png",
      monogram: "C"
    },
    {
      path: "wish-day-guide/",
      title: "Wish Day Guide",
      description: "Day-of guide for the Disney Wish visit — itinerary, maps, and logistics for October 30, 2026.",
      icon: "wish-day-guide/icons/icon.svg",
      monogram: "W"
    }
  ];

  const grid = document.getElementById("sites");
  for (const site of SITES) {
    const a = document.createElement("a");
    a.className = "card";
    a.href = site.path;
    const visual = site.icon
      ? '<img class="icon" src="' + site.icon + '" alt="" width="512" height="512">'
      : '<div class="mark">' + site.monogram + "</div>";
    a.innerHTML = visual + "<h3></h3><p></p>";
    a.querySelector("h3").textContent = site.title;
    a.querySelector("p").textContent = site.description;
    grid.appendChild(a);
  }
  document.getElementById("count").textContent =
    SITES.length + (SITES.length === 1 ? " site" : " sites");

  // Keep navigation inside the home-screen app window on iOS: a plain link
  // tap would otherwise bounce out to Safari, header and footer and all.
  if (window.navigator.standalone) {
    document.addEventListener("click", function (e) {
      const a = e.target.closest("a");
      if (!a) return;
      const url = new URL(a.href, window.location.href);
      if (url.origin === window.location.origin) {
        e.preventDefault();
        window.location.href = a.href;
      }
    });
  }
</script>
</body>
</html>
