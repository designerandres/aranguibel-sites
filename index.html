<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Apps — Andres Aranguibel</title>
<meta name="description" content="An index of microsites published at sites.aranguibel.com.">
<meta property="og:type" content="website">
<meta property="og:title" content="Apps — Andres Aranguibel">
<meta property="og:description" content="Every microsite published at sites.aranguibel.com, in one place.">
<meta property="og:url" content="https://sites.aranguibel.com/">
<meta property="og:image" content="https://sites.aranguibel.com/assets/headshot.jpg">
<meta name="twitter:card" content="summary">
<meta name="twitter:image" content="https://sites.aranguibel.com/assets/headshot.jpg">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Apps">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fed600'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-style='italic' font-size='38' fill='%23131c2b' text-anchor='middle'%3Ea%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Wire+One&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --edge: #e7e7e7;
    --edge-strong: #c9c9c9;
    --ink: #272727;
    --headline: #131313;
    --muted: #767676;
    --faint: #a8a8a8;
    --brand: #fed600;
    --on-brand: #131c2b;
    --shadow: 0 1px 2px rgba(39, 39, 39, 0.05), 0 12px 32px -12px rgba(39, 39, 39, 0.18);
    --shadow-lift: 0 2px 4px rgba(39, 39, 39, 0.06), 0 20px 44px -14px rgba(39, 39, 39, 0.28);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101010;
      --surface: #171717;
      --edge: #2b2b2b;
      --edge-strong: #4a4a4a;
      --ink: #e8e8e8;
      --headline: #f5f5f5;
      --muted: #a3a3a3;
      --faint: #6f6f6f;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.45), 0 12px 32px -12px rgba(0, 0, 0, 0.6);
      --shadow-lift: 0 2px 4px rgba(0, 0, 0, 0.5), 0 20px 44px -14px rgba(0, 0, 0, 0.72);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "proxima-nova", "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--ink);
    min-height: 100vh; min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 72rem; margin: 0 auto; padding: 0 1.5rem; }

  /* Header bar, after aranguibel.com — sticky: stays pinned while the page scrolls */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: var(--bg);
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: max(1.1rem, env(safe-area-inset-top)) 0 1.1rem;
    border-bottom: 1px solid var(--edge);
  }
  .brand-lockup { display: flex; align-items: center; gap: 0.8rem; text-decoration: none; color: inherit; min-width: 0; }
  .brand-lockup img {
    width: 2.6rem; height: 2.6rem; border-radius: 50%; flex: 0 0 auto;
    object-fit: cover; aspect-ratio: 1 / 1; display: block;
  }
  .brand-lockup .site-title {
    font-family: "Wire One", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 1.55rem; font-weight: 700; letter-spacing: 0.045em; line-height: 1;
    color: var(--headline); white-space: nowrap;
  }
  .topbar nav a {
    font-size: 0.72rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--muted); text-decoration: none; white-space: nowrap;
  }
  .topbar nav a:hover { color: var(--headline); }

  /* Hero */
  .hero {
    display: grid; gap: 2rem; align-items: center;
    padding: 3rem 0 2.6rem;
  }
  @media (min-width: 760px) {
    .hero { grid-template-columns: 1fr 19rem; padding: 4rem 0 3.2rem; }
  }
  .hero-photo { display: none; }
  @media (min-width: 760px) {
    .hero-photo {
      display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover;
      border-radius: 4px;
    }
  }
  .kicker {
    display: flex; align-items: center; gap: 0.65rem;
    font-size: 0.7rem; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 1.2rem;
  }
  .kicker::before { content: ""; width: 2rem; height: 3px; background: var(--brand); flex: 0 0 auto; }
  h1 {
    font-family: "Wire One", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: clamp(4.2rem, 13vw, 7.5rem); font-weight: 400; line-height: 0.95;
    letter-spacing: 0.01em; color: var(--headline); text-transform: uppercase;
  }
  /* Index */
  .index-head {
    display: flex; align-items: baseline; justify-content: space-between;
    border-top: 1px solid var(--edge); padding-top: 1.4rem; margin-bottom: 1.2rem;
  }
  .index-head h2 {
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: var(--headline);
  }
  .index-head span { font-size: 0.8rem; color: var(--faint); }
  .grid {
    display: grid; gap: 1.1rem;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 20rem), 1fr));
    margin-bottom: 3.5rem;
  }
  .card {
    display: flex; flex-direction: column; gap: 0.7rem;
    padding: 1.5rem 1.5rem 1.35rem; min-height: 10rem;
    background: var(--surface); text-decoration: none; color: inherit;
    border: 1px solid var(--edge); border-radius: 20px;
    box-shadow: var(--shadow);
    transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .card:hover, .card:focus-visible { transform: translateY(-3px); box-shadow: var(--shadow-lift); outline: none; }
  .card:active { transform: translateY(-1px) scale(0.995); box-shadow: var(--shadow); }
  .mark {
    width: 2.6rem; height: 2.6rem; border-radius: 4px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 1.35rem;
    color: var(--brand); background: var(--headline);
  }
  @media (prefers-color-scheme: dark) { .mark { background: var(--brand); color: var(--on-brand); } }
  .icon {
    width: 3.6rem; height: 3.6rem; border-radius: 26%; flex: 0 0 auto;
    object-fit: cover; aspect-ratio: 1 / 1; display: block;
    border: 1px solid var(--edge);
    box-shadow: 0 2px 8px rgba(39, 39, 39, 0.12);
  }
  .card h3 { font-size: 1.08rem; font-weight: 600; letter-spacing: -0.005em; color: var(--headline); }
  .card p { font-size: 0.92rem; line-height: 1.55; color: var(--muted); flex: 1 1 auto; }

  /* Reorder tools (signed-in owner edit mode) */
  .idx-tools { display: flex; align-items: center; gap: 0.55rem; }
  button.tool {
    font: inherit; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
    padding: 0.5rem 0.85rem; border-radius: 999px; border: 1px solid var(--edge-strong);
    background: var(--surface); color: var(--headline); cursor: pointer; white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }
  button.tool.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
  button.tool[hidden] { display: none; }
  .editbar {
    display: none; font-size: 0.85rem; color: var(--muted); line-height: 1.5;
    border: 1px dashed var(--edge-strong); border-radius: 12px; padding: 0.8rem 1rem; margin-bottom: 1.1rem;
  }
  body.editing .editbar { display: block; }
  .editmsg { display: none; font-size: 0.85rem; color: var(--muted); margin-bottom: 1.1rem; }
  .editmsg.on { display: block; }
  .card .mv { display: none; gap: 0.45rem; margin-left: auto; }
  body.editing .card .mv { display: flex; }
  .card .mv button {
    width: 2.3rem; height: 2.3rem; border-radius: 50%; border: 1px solid var(--edge-strong);
    background: var(--surface); color: var(--headline); font-size: 1.05rem; line-height: 1; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .card .mv button[disabled] { opacity: 0.3; cursor: default; }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.8rem; width: 100%; }
  body.editing .card { cursor: default; }
  body.editing .card:hover, body.editing .card:focus-visible { transform: none; box-shadow: var(--shadow); }

  footer {
    border-top: 1px solid var(--edge);
    padding: 1.4rem 0 max(2.2rem, env(safe-area-inset-bottom));
    display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; justify-content: space-between;
    font-size: 0.8rem; color: var(--faint); line-height: 1.6;
  }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--headline); }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a class="brand-lockup" href="https://www.aranguibel.com" aria-label="Andres Aranguibel — portfolio">
      <img src="assets/headshot.jpg" alt="Portrait of Andres Aranguibel" width="180" height="180">
      <span class="site-title">ANDRES ARANGUIBEL</span>
    </a>
    <nav><a href="https://www.aranguibel.com">Portfolio &rarr;</a></nav>
  </div>

  <section class="hero">
    <div>
      <div class="kicker">sites.aranguibel.com</div>
      <h1>Apps</h1>
    </div>
    <img class="hero-photo" src="assets/headshot.jpg" alt="Portrait of Andres Aranguibel" width="720" height="720">
  </section>

  <div class="index-head">
    <h2>Index</h2>
    <div class="idx-tools">
      <span id="count"></span>
      <button class="tool" id="btnEdit" type="button" hidden>Edit order</button>
      <button class="tool" id="btnCancel" type="button" hidden>Cancel</button>
      <button class="tool primary" id="btnSave" type="button" hidden>Save</button>
    </div>
  </div>
  <p class="editbar">Reorder mode — use the arrows on each card to move it, then Save. The saved order is shared: everyone who opens this page sees it.</p>
  <p class="editmsg" id="editMsg" role="status"></p>
  <nav class="grid" id="sites" aria-label="Microsites"></nav>

  <footer>
    <span>New sites appear here as they're published.</span>
    <a href="https://www.aranguibel.com">aranguibel.com</a>
  </footer>
</div>

<script>
  // The index of published microsites. One entry per folder in the repo;
  // this list is updated in the same commit that publishes a new site.
  // Every site gets its own contextual icon: prefer an icon the site itself
  // ships (e.g. its app icon); otherwise a custom one lives in assets/icons/.
  const SITES = [
    {
      path: "poppy-picks/",
      title: "Poppy's Picks",
      description: "Family fun near home — local picks for your 3-year-old, date nights, and day trips, refreshed every morning.",
      icon: "poppy-picks/icons/icon-512.png?v=2",
      monogram: "P"
    },
    {
      path: "lodge-boys-2026/",
      title: "Lodge Boys 2026",
      description: "Our Asheville Christmas trip — the Omni Grove Park Inn & Biltmore itinerary, December 19–23, 2026.",
      icon: "lodge-boys-2026/icons/icon.svg",
      monogram: "L"
    },
    {
      path: "cycles/",
      title: "Cycles",
      description: "Recurring chores and to-dos — each on its own cadence, resetting when done.",
      icon: "cycles/icons/icon-512.png",
      monogram: "C"
    },
    {
      path: "max-pocket-agenda/",
      title: "MAX Pocket Agenda",
      description: "Adobe MAX 2026 companion — schedule, people, and places, in your pocket.",
      icon: "max-pocket-agenda/icons/icon-512.png",
      monogram: "M"
    },
    {
      path: "wish-day-guide/",
      title: "Wish Day Guide",
      description: "Day-of guide for the Disney Wish visit — itinerary, maps, and logistics for October 30, 2026.",
      icon: "wish-day-guide/icons/icon.svg",
      monogram: "W"
    }
  ];

  const grid = document.getElementById("sites");
  let displaySites = SITES.slice();
  let savedOrder = null; // last order fetched from (or saved to) the server

  function applyOrder(order) {
    if (!Array.isArray(order)) return;
    const known = new Map(SITES.map(s => [s.path, s]));
    const next = [];
    for (const p of order) { if (known.has(p)) { next.push(known.get(p)); known.delete(p); } }
    for (const s of SITES) { if (known.has(s.path)) next.push(s); } // new sites append at the end
    displaySites = next;
  }

  function renderGrid() {
    grid.innerHTML = "";
    displaySites.forEach((site, i) => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = site.path;
      const visual = site.icon
        ? '<img class="icon" src="' + site.icon + '" alt="" width="512" height="512">'
        : '<div class="mark">' + site.monogram + "</div>";
      a.innerHTML = '<div class="card-top">' + visual +
        '<span class="mv"><button type="button" data-mv="-1" aria-label="Move up">&#8593;</button>' +
        '<button type="button" data-mv="1" aria-label="Move down">&#8595;</button></span></div>' +
        "<h3></h3><p></p>";
      a.querySelector("h3").textContent = site.title;
      a.querySelector("p").textContent = site.description;
      const btns = a.querySelectorAll(".mv button");
      btns[0].disabled = i === 0;
      btns[1].disabled = i === displaySites.length - 1;
      btns.forEach(b => b.addEventListener("click", (e) => {
        e.preventDefault(); e.stopPropagation();
        const j = i + parseInt(b.dataset.mv, 10);
        if (j < 0 || j >= displaySites.length) return;
        const t = displaySites[i]; displaySites[i] = displaySites[j]; displaySites[j] = t;
        renderGrid();
      }));
      a.addEventListener("click", (e) => { if (document.body.classList.contains("editing")) e.preventDefault(); });
      grid.appendChild(a);
    });
    document.getElementById("count").textContent =
      displaySites.length + (displaySites.length === 1 ? " site" : " sites");
  }
  renderGrid();

  // Shared order: the server copy wins over the baked-in list order, so a
  // reorder saved on one device shows up on every device.
  fetch("/api/apps/order", { cache: "no-store" })
    .then(r => r.ok ? r.json() : null)
    .then(j => { if (j && Array.isArray(j.order)) { savedOrder = j.order; applyOrder(j.order); renderGrid(); } })
    .catch(() => { /* offline — baked-in order stands */ });

  // --- Edit order (signed-in accounts only) ---
  const $id = (x) => document.getElementById(x);
  const btnEdit = $id("btnEdit"), btnCancel = $id("btnCancel"), btnSave = $id("btnSave"), editMsg = $id("editMsg");
  function msg(t) { editMsg.textContent = t || ""; editMsg.classList.toggle("on", !!t); }
  function b64uToBuf(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return Uint8Array.from(atob(s), c => c.charCodeAt(0)).buffer; }
  function bufToB64u(buf) { const b = new Uint8Array(buf); let s = ""; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
  async function api(method, path, body) {
    const r = await fetch(path, { method, headers: body ? { "Content-Type": "application/json" } : undefined, body: body ? JSON.stringify(body) : undefined });
    if (!r.ok) { const e = new Error("api " + r.status); e.status = r.status; throw e; }
    return r.json();
  }
  async function signedIn() { try { const me = await api("GET", "/api/auth/me"); return !!(me && me.signedIn); } catch { return false; } }
  async function passkeySignIn() {
    const options = await api("POST", "/api/auth/login/options", {});
    options.challenge = b64uToBuf(options.challenge);
    const cred = await navigator.credentials.get({ publicKey: options });
    await api("POST", "/api/auth/login/verify", { credential: { id: bufToB64u(cred.rawId), rawId: bufToB64u(cred.rawId), type: cred.type, response: { authenticatorData: bufToB64u(cred.response.authenticatorData), clientDataJSON: bufToB64u(cred.response.clientDataJSON), signature: bufToB64u(cred.response.signature), userHandle: cred.response.userHandle ? bufToB64u(cred.response.userHandle) : null } } });
  }
  function setEditing(on) {
    document.body.classList.toggle("editing", on);
    btnEdit.hidden = on; btnCancel.hidden = !on; btnSave.hidden = !on;
    renderGrid();
  }
  btnEdit.addEventListener("click", async () => {
    msg("");
    btnEdit.disabled = true;
    try {
      if (!(await signedIn())) { await passkeySignIn(); }
      if (await signedIn()) { setEditing(true); }
      else msg("Sign-in didn't complete — please try again.");
    } catch (e) { msg("Sign-in didn't complete — please try again."); }
    btnEdit.disabled = false;
  });
  btnCancel.addEventListener("click", () => { applyOrder(savedOrder); setEditing(false); msg(""); });
  btnSave.addEventListener("click", async () => {
    btnSave.disabled = true; btnCancel.disabled = true;
    try {
      const order = displaySites.map(s => s.path);
      await api("PUT", "/api/apps/order", { order });
      savedOrder = order;
      setEditing(false);
      msg("Order saved — it now shows this way on every device.");
    } catch (e) { msg("That save didn't go through. Check your connection and try again."); }
    btnSave.disabled = false; btnCancel.disabled = false;
  });
  // The button appears for everyone; tapping it starts Face ID sign-in if
  // needed, so there is nothing extra to find.
  btnEdit.hidden = false;

  // Freshness: this page is often resumed from the home-screen app without a
  // real reload, which can leave a stale app list on screen (a newly added
  // site missing until the app is fully closed and reopened). On load, and
  // whenever the page becomes visible again, re-fetch the page bypassing
  // caches and compare the app list; if it changed, reload once to show it.
  (function () {
    const grabSites = s => { const m = /const SITES = \[[\s\S]*?\];/.exec(s || ""); return m ? m[0] : ""; };
    let lastCheck = 0;
    async function checkForNewApps() {
      const now = Date.now();
      if (now - lastCheck < 30000) return;
      lastCheck = now;
      try {
        const res = await fetch(window.location.pathname, { cache: "no-store" });
        if (!res.ok) return;
        const fresh = grabSites(await res.text());
        const mine = grabSites(document.documentElement.outerHTML);
        if (fresh && mine && fresh !== mine) {
          if (sessionStorage.getItem("appsIdxReloadedFor") === fresh) return; // already tried for this version — never loop
          sessionStorage.setItem("appsIdxReloadedFor", fresh);
          window.location.reload();
        }
      } catch (e) { /* offline or blocked — stay on this copy */ }
    }
    window.addEventListener("load", () => setTimeout(checkForNewApps, 800));
    document.addEventListener("visibilitychange", () => { if (!document.hidden) checkForNewApps(); });
    window.addEventListener("pageshow", checkForNewApps);
  })();

  // Keep navigation inside the home-screen app window on iOS: a plain link
  // tap would otherwise bounce out to Safari, header and footer and all.
  if (window.navigator.standalone) {
    document.addEventListener("click", function (e) {
      const a = e.target.closest("a");
      if (!a) return;
      const url = new URL(a.href, window.location.href);
      if (url.origin === window.location.origin) {
        e.preventDefault();
        window.location.href = a.href;
      }
    });
  }
</script>
</body>
</html>
