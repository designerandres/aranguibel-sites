      <path d="M204 196 C218 192 234 194 246 200"/>
      <path d="M204 228 C218 224 234 226 246 232"/>
      <path d="M204 260 C218 256 234 258 246 264"/>
      <path d="M266 200 C278 194 294 192 308 196"/>
