<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Archives — Sarah's Library</title>
<meta name="description" content="Sarah's reading library — her books by year, ratings and journal notes, the wishlist, and what she's currently reading.">
<meta name="theme-color" content="#120a05">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Library">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=2">
<link rel="icon" href="icons/icon-192.png?v=2" type="image/png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="theme.css">
<style>
  /* Boot gate only — the app itself is styled entirely by theme.css
     (Sarah's original stylesheet, compiled with Tailwind v4). */
  *{ -webkit-tap-highlight-color: transparent; }
  [hidden]{ display:none !important; }
  body{ margin:0; background:#120a05; }
  .boot-msg{ min-height:100dvh; display:flex; align-items:center; justify-content:center;
    font-family:"Cormorant Garamond","EB Garamond",Georgia,serif; letter-spacing:.22em;
    text-transform:uppercase; color:#f0d488; font-size:15px; padding:24px; text-align:center; }
</style>
</head>
<body>
<div id="boot" class="boot-msg">Opening the archives&hellip;</div>
<div data-generated-space-root="" data-generated-space-slug="books" hidden></div>
<script>
  // Platform gate (same shape as the other microsites): confirm the
  // passkey session before loading the app bundle; a 401 sends the
  // reader to sign in. No document.write; the bundle is injected as a
  // module script only once the session checks out — or, if the check
  // itself fails (offline), anyway, and the data calls decide.
  (function () {
    var booted = false;
    function start() {
      if (booted) return;
      booted = true;
      document.querySelector("[data-generated-space-root]").hidden = false;
      document.getElementById("boot").hidden = true;
      var s = document.createElement("script");
      s.type = "module";
      s.src = "app.js";
      document.body.appendChild(s);
    }
    fetch("/api/auth/me").then(function (r) {
      if (r.status === 401) { location.href = "/login/"; return; }
      return r.json().catch(function () { return null; }).then(function (me) {
        if (me && me.signedIn === false) { location.href = "/login/"; return; }
        start();
      });
    }).catch(function () { start(); });
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
  })();
</script>
</body>
</html>
