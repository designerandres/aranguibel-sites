<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello — starter microsite</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #faf8f4; color: #191920; padding: 2rem;
  }
  main { max-width: 36rem; }
  .kicker { font-size: 0.8rem; letter-spacing: 0.14em; text-transform: uppercase; color: #7c6cf0; margin-bottom: 1rem; }
  h1 { font-size: 2.4rem; font-weight: 650; letter-spacing: -0.03em; line-height: 1.1; margin-bottom: 1rem; }
  p { font-size: 1.05rem; line-height: 1.6; color: #4c4c55; }
  code { background: #eceaf6; padding: 0.1em 0.35em; border-radius: 4px; font-size: 0.92em; }
</style>
</head>
<body>
<main>
  <div class="kicker">Starter microsite</div>
  <h1>Hello from /hello/</h1>
  <p>This folder is the pattern: every microsite is a folder in the repo with an <code>index.html</code> inside it, and it publishes at <code>sites.aranguibel.com/&lt;folder-name&gt;/</code>. Replace this folder's contents — or add new folders — to publish new sites.</p>
</main>
</body>
</html>
