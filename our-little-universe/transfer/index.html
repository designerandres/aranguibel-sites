  const fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  async function api(method, path, body) {
    const r = await fetch(path, { method, headers: body ? { 'Content-Type': 'application/json' } : undefined, body: body ? JSON.stringify(body) : undefined });
    if (!r.ok) { const e = new Error('api ' + r.status); e.status = r.status; try { const j = await r.json(); if (j && j.error) e.serverError = j.error; } catch (x) {} throw e; }
    return r.json();
  }
  document.getElementById('f').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const b = document.getElementById('b'), e = document.getElementById('e'), ok = document.getElementById('ok');
    b.disabled = true; b.textContent = 'Working…'; e.style.display = 'none'; ok.style.display = 'none';
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('pw').value), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: fromB64(PAYLOAD.salt), iterations: PAYLOAD.iterations, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(PAYLOAD.iv) }, key, fromB64(PAYLOAD.data));
      const html = new TextDecoder().decode(plain);
      const res = await api('PUT', '/api/olu/content', { html });
      ok.textContent = 'Stored ' + res.bytes + ' bytes at ' + res.updatedAt + '. You can close this page — open Our Little Universe from the Skipper’s Log.';

      b.textContent = 'Done';

      b.disabled = false; b.textContent = 'Decrypt & store';
