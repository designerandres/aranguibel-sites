<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #f3f2ee; color: #1c2340; min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: max(1.5rem, env(safe-area-inset-top)) 1.25rem max(1.5rem, env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  .card {
    background: #fff; border-radius: 24px; box-shadow: 0 18px 50px -18px rgba(13, 43, 110, 0.35);
    padding: 2.2rem 1.8rem 1.9rem; width: 100%; max-width: 22.5rem; text-align: center;
  }
  .icon { width: 5.2rem; height: 5.2rem; border-radius: 24%; margin-bottom: 1.1rem; box-shadow: 0 6px 18px rgba(13,43,110,.25); }
  h1 { font-size: 1.28rem; font-weight: 700; color: #0d2b6e; letter-spacing: -0.01em; }
  .blurb { margin: 0.45rem 0 0; font-size: 0.92rem; line-height: 1.5; color: #5a6076; }
  .prompt { margin: 1.5rem 0 1rem; font-size: 0.98rem; font-weight: 550; color: #1c2340; }
  form { display: flex; flex-direction: column; gap: 0.8rem; text-align: left; }
  .pw-wrap { position: relative; }
  .pw-wrap input {
    width: 100%; font-size: 16px; padding: 0.85rem 3rem 0.85rem 1rem; border-radius: 12px;
    border: 1.5px solid #d8d5cc; background: #fbfaf7; color: inherit; outline: none;
  }
  .pw-wrap input:focus { border-color: #0d2b6e; background: #fff; }
  .eye {
    position: absolute; top: 50%; right: 0.35rem; transform: translateY(-50%);
    width: 2.5rem; height: 2.5rem; display: flex; align-items: center; justify-content: center;
    background: none; border: 0; border-radius: 9px; padding: 0; cursor: pointer;
    color: #8a90a6; -webkit-tap-highlight-color: transparent;
  }
  .eye svg { width: 1.35rem; height: 1.35rem; display: block; }
  .eye .slash { display: none; }
  .eye.showing .slash { display: block; }
  .eye.showing .open-eye { opacity: 0.35; }
  button.submit {
    font-size: 1rem; font-weight: 650; padding: 0.85rem 1rem; border: 0; border-radius: 12px;
    background: #0d2b6e; color: #fff; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  button.submit:active { transform: scale(0.99); }
  button.submit[disabled] { opacity: 0.6; }
  .remember { display: flex; align-items: center; gap: 0.5rem; font-size: 0.88rem; color: #5a6076; }
  .remember input { width: 1.05rem; height: 1.05rem; accent-color: #0d2b6e; }
  .error { display: none; font-size: 0.88rem; color: #b3261e; text-align: center; }
  .shake { animation: shake 0.4s ease; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
  @media (prefers-color-scheme: dark) {
    body { background: #0a0f1e; color: #e9edf8; }
    .card { background: #131c31; box-shadow: 0 18px 50px -18px rgba(0, 0, 0, 0.8); }
    .icon { box-shadow: 0 6px 18px rgba(0, 0, 0, 0.55); }
    h1 { color: #c9d7ff; }
    .blurb { color: #9aa7c7; }
    .prompt { color: #e9edf8; }
    .pw-wrap input { background: #0d1526; border-color: #2b3a5e; color: #eef1f8; }
    .pw-wrap input:focus { border-color: #7aa2ff; background: #0a1120; }
    .eye { color: #7e8cab; }
    button.submit { background: #2b5de8; }
    .remember { color: #9aa7c7; }
    .remember input { accent-color: #2b5de8; }
    .error { color: #ff9d94; }
  }
</style>

  <h1>MAX Pocket Agenda</h1>
  <p class="blurb">Adobe MAX 2026 companion — schedule, people, and places, in your pocket.</p>
  <p class="prompt">Please enter a password to access this app.</p>

      <button type="button" class="eye" id="eye" aria-label="Show password" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path class="open-eye" d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
          <circle class="open-eye" cx="12" cy="12" r="3"/>
          <line class="slash" x1="4" y1="4" x2="20" y2="20"/>
        </svg>
      </button>
    </div>
    <p class="error" id="error">That password didn't work. Try again.</p>
    <label class="remember"><input type="checkbox" id="remember"> Remember this device</label>
    <button type="submit" class="submit" id="submit">Unlock</button>
  </form>
</main>

  const STORE_KEY = "max-agenda-key-v1";
  const form = document.getElementById("form");
  const pwInput = document.getElementById("pw");
  const submitBtn = document.getElementById("submit");
  const errorEl = document.getElementById("error");
  const card = document.getElementById("card");
  const eyeBtn = document.getElementById("eye");

  eyeBtn.addEventListener("click", () => {
    const show = pwInput.type === "password";
    pwInput.type = show ? "text" : "password";
    eyeBtn.classList.toggle("showing", show);
    eyeBtn.setAttribute("aria-label", show ? "Hide password" : "Show password");
    eyeBtn.setAttribute("aria-pressed", String(show));
    pwInput.focus();
  });

  const fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

  async function deriveKey(password) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: fromB64(PAYLOAD.salt), iterations: PAYLOAD.iterations, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }

  async function decryptWith(key) {
    const plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: fromB64(PAYLOAD.iv) }, key, fromB64(PAYLOAD.data));
    return new TextDecoder().decode(plain);
  }

  function openApp(html) {
    document.open();
    document.write(html);
    document.close();
  }

  function fail() {
    errorEl.style.display = "block";
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    submitBtn.disabled = false;
    submitBtn.textContent = "Unlock";
    pwInput.select();
  }

  form.addEventListener("submit", async (e) => {

    try {
      const key = await deriveKey(pwInput.value);
      const html = await decryptWith(key);
      if (document.getElementById("remember").checked) {
        const jwk = await crypto.subtle.exportKey("jwk", key);
        localStorage.setItem(STORE_KEY, JSON.stringify(jwk));
      }
      openApp(html);
    } catch {
      fail();
    }
  });

  // Returning to a remembered device: unlock without a prompt.
  (async () => {
    const saved = localStorage.getItem(STORE_KEY);
    if (!saved) return;
    try {
      const key = await crypto.subtle.importKey("jwk", JSON.parse(saved), { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      const html = await decryptWith(key);
      openApp(html);
    } catch {
      localStorage.removeItem(STORE_KEY);
    }
  })();
</script>
</body>
